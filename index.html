```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #fffdf0; }
        .header-bg { background: #E60000; height: 120px; position: relative; }
        .logo-container { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); }
        .logo-profile { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #FFD700; background: white; object-fit: cover; }
    </style>
</head>
<body class="pb-32">

    <div class="header-bg">
        <div class="logo-container">
            <!-- AQUI ESTÁ O QUE VOCÊ PROCURAVA -->
            <img src="logo.jpg" class="logo-profile" alt="Logo">
        </div>
    </div>

    <div class="bg-[#FFD700] pt-12 pb-6 text-center">
        <h1 class="text-2xl font-bold text-red-600 uppercase">Pastel da Aline</h1>
        <p class="text-red-800 text-xs italic">"Nunca foi sorte, sempre foi Deus"</p>
        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://wa.me/5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-md"><i class="fab fa-whatsapp"></i></a>
            <a href="tel:5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-md"><i class="fas fa-phone-alt"></i></a>
        </div>
    </div>

    <div class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-center border-l-4 border-yellow-400">
            <div class="flex-1">
                <h3 class="font-bold text-gray-800">PASTEL ESPECIAL</h3>
                <p class="text-[10px] text-gray-400">Carne, queijo e tempero da Aline.</p>
                <p class="text-red-600 font-bold">R$ 18,00</p>
            </div>
            <button onclick="add('Pastel Especial', 18)" class="bg-red-600 text-white w-8 h-8 rounded-lg font-bold">+</button>
        </div>
    </div>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 hidden">
        <div class="bg-red-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-2xl">
            <div><p id="c-count" class="text-[10px] font-bold uppercase">0 ITENS</p><p id="c-total" class="text-lg font-bold">R$ 0,00</p></div>
            <button onclick="send()" class="bg-yellow-400 text-red-700 px-6 py-2 rounded-xl font-bold text-xs uppercase font-bold">Finalizar no WhatsApp</button>
        </div>
    </div>

    <script>
        let cart = []; let total = 0;
        function add(n, p) {
            cart.push({n, p}); total += p;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('c-count').innerText = cart.length + " ITENS";
            document.getElementById('c-total').innerText = "R$ " + total.toFixed(2);
        }
        function send() {
            let n = prompt("Seu nome:"); let e = prompt("Endereço:");
            if(!n || !e) return;
            let t = `*PEDIDO - ALINE*\n*Cliente:* ${n}\n*Endereço:* ${e}\n\n*ITENS:*\n`;
            cart.forEach(i => t += `• ${i.n} - R$ ${i.p.toFixed(2)}\n`);
            t += `\n*TOTAL: R$ ${total.toFixed(2)}*`;
            window.open(`https://wa.me/5581986811235?text=${encodeURIComponent(t)}`);
        }
    </script>
</body>
</html>
