<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Cardápio Interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fffdf0; overflow-x: hidden; }
        .bg-yellow-aline { background-color: #FFD700; }
        .bg-red-aline { background-color: #E60000; }
        .text-red-aline { color: #E60000; }
        
        /* Capa Profissional */
        .header-bg { 
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://i.postimg.cc/8zGfK6P9/pastel-bg.jpg'); 
            background-size: cover; background-position: center; height: 160px; position: relative;
        }
        
        .logo-container {
            position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); z-index: 10;
        }
        .logo-profile {
            width: 110px; height: 110px; border-radius: 50%; border: 4px solid #FFD700;
            background-color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* Animações de Modal */
        .modal-enter { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .btn-option { border: 2px solid #eee; transition: 0.3s; }
        .btn-option.selected { border-color: #E60000; background-color: #fff5f5; color: #E60000; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <!-- CABEÇALHO -->
    <div class="header-bg">
        <div class="absolute top-4 left-4 bg-green-500 text-white text-[10px] px-3 py-1 rounded-full font-bold shadow-lg">● ABERTO</div>
        <div class="logo-container">
            <!-- LOGO QUE VOCÊ ENVIOU -->
            <img src="https://i.postimg.cc/kX87pPj7/f76020c2-be00-4822-bc78-62d2958479e0.jpg" class="logo-profile object-cover">
        </div>
    </div>

    <!-- TÍTULO E CONTATOS -->
    <div class="bg-yellow-aline pt-16 pb-6 px-6 text-center">
        <h1 class="text-2xl font-bold text-red-600 uppercase">Pastel da Aline</h1>
        <p class="text-red-800 text-xs italic font-medium">"Nunca foi sorte, sempre foi Deus"</p>
        
        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://wa.me/5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-md"><i class="fab fa-whatsapp"></i></a>
            <a href="tel:5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-md"><i class="fas fa-phone-alt"></i></a>
            <a href="https://maps.google.com" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-md"><i class="fas fa-map-marker-alt"></i></a>
        </div>
    </div>

    <!-- CATEGORIAS -->
    <div class="sticky top-0 bg-white/90 backdrop-blur-md z-40 py-4 px-4 flex space-x-3 overflow-x-auto no-scrollbar shadow-sm">
        <button class="bg-red-600 text-white px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">PASTÉIS</button>
        <button class="bg-gray-100 text-gray-400 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">HAMBÚRGUERES</button>
        <button class="bg-gray-100 text-gray-400 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">PIZZAS</button>
        <button class="bg-gray-100 text-gray-400 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">BEBIDAS</button>
    </div>

    <!-- PRODUTOS -->
    <div id="lista-produtos" class="p-4 space-y-4">
        <!-- Item 1 -->
        <div class="bg-white p-4 shadow-md rounded-2xl flex justify-between items-center border-l-4 border-yellow-400">
            <div class="flex-1 pr-4">
                <h3 class="font-bold text-gray-800 text-sm">PASTEL DE CARNE ESPECIAL</h3>
                <p class="text-[10px] text-gray-500 my-1 leading-tight">Carne premium, ovo, azeitona e tempero especial.</p>
                <p class="text-red-600 font-bold text-lg">R$ 15,00</p>
            </div>
            <div class="relative w-20 h-20">
                <img src="https://i.postimg.cc/8zGfK6P9/pastel-bg.jpg" class="w-full h-full object-cover rounded-xl">
                <button onclick="add('Pastel Carne', 15.00)" class="absolute -bottom-1 -left-1 bg-red-600 text-white w-8 h-8 rounded-lg shadow-lg flex items-center justify-center font-bold">+</button>
            </div>
        </div>
    </div>

    <!-- CARRINHO INFERIOR -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 z-50 hidden">
        <div class="bg-red-600 text-white p-4 rounded-2xl flex items-center justify-between shadow-2xl">
            <div>
                <p id="cart-count" class="text-[10px] font-bold opacity-80 uppercase">0 ITENS</p>
                <p id="cart-total" class="text-lg font-bold">R$ 0,00</p>
            </div>
            <button onclick="toggleCheckout(true)" class="bg-yellow-400 text-red-700 px-6 py-2 rounded-xl font-bold uppercase text-xs">Finalizar Pedido</button>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT (PROFISSIONAL) -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col justify-end">
        <div class="bg-white w-full max-h-[90vh] rounded-t-[30px] p-6 overflow-y-auto modal-enter">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Finalizar Pedido</h2>
            
            <!-- Tipo de Entrega -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button id="btn-entrega" onclick="setDelivery('Entrega')" class="btn-option p-4 rounded-2xl flex flex-col items-center selected">
                    <i class="fas fa-motorcycle mb-2"></i> <span class="text-xs font-bold">Entrega</span>
                </button>
                <button id="btn-retirada" onclick="setDelivery('Retirada')" class="btn-option p-4 rounded-2xl flex flex-col items-center">
                    <i class="fas fa-store mb-2"></i> <span class="text-xs font-bold">Retirada</span>
                </button>
            </div>

            <!-- Campos de Texto -->
            <div class="space-y-3 mb-6">
                <input type="text" id="nome" placeholder="Seu Nome" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400">
                <input type="text" id="endereco" placeholder="Endereço Completo (Rua, Nº, Bairro)" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <!-- Pagamento -->
            <p class="font-bold text-gray-700 mb-3 text-sm">Forma de Pagamento:</p>
            <div class="grid grid-cols-3 gap-2 mb-6 text-[10px]">
                <button onclick="setPayment('Pix')" class="btn-pay p-3 border rounded-xl flex flex-col items-center font-bold text-gray-500">
                    <i class="fas fa-qrcode mb-1 text-blue-500"></i> PIX
                </button>
                <button onclick="setPayment('Cartão')" class="btn-pay p-3 border rounded-xl flex flex-col items-center font-bold text-gray-500">
                    <i class="fas fa-credit-card mb-1 text-purple-500"></i> CARTÃO
                </button>
                <button onclick="setPayment('Dinheiro')" class="btn-pay p-3 border rounded-xl flex flex-col items-center font-bold text-gray-500">
                    <i class="fas fa-money-bill-wave mb-1 text-green-500"></i> DINHEIRO
                </button>
            </div>

            <!-- Troco -->
            <div id="troco-area" class="hidden mb-6">
                <input type="number" id="troco" placeholder="Troco para quanto?" class="w-full p-4 bg-gray-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-green-400">
            </div>

            <button onclick="sendOrder()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center">
                <i class="fab fa-whatsapp mr-2 text-xl"></i> ENVIAR PELO WHATSAPP
            </button>
            <button onclick="toggleCheckout(false)" class="w-full text-gray-400 text-xs font-bold py-4">VOLTAR AO CARDÁPIO</button>
        </div>
    </div>

    <script>
        let cart = []; let total = 0; let deliveryType = 'Entrega'; let paymentType = '';

        function add(n, p) {
            cart.push({n, p}); total += p;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('cart-count').innerText = `${cart.length} ITENS NA SACOLA`;
            document.getElementById('cart-total').innerText = 'R$ ' + total.toFixed(2);
        }

        function toggleCheckout(show) {
            document.getElementById('modal-checkout').classList.toggle('hidden', !show);
            document.getElementById('modal-checkout').classList.toggle('flex', show);
        }

        function setDelivery(type) {
            deliveryType = type;
            document.getElementById('btn-entrega').classList.toggle('selected', type === 'Entrega');
            document.getElementById('btn-retirada').classList.toggle('selected', type === 'Retirada');
            document.getElementById('endereco').style.display = type === 'Retirada' ? 'none' : 'block';
        }

        function setPayment(type) {
            paymentType = type;
            document.querySelectorAll('.btn-pay').forEach(b => b.classList.remove('selected', 'border-red-500', 'text-red-500'));
            event.currentTarget.classList.add('border-red-500', 'text-red-500');
            document.getElementById('troco-area').classList.toggle('hidden', type !== 'Dinheiro');
        }

        function sendOrder() {
            const nome = document.getElementById('nome').value;
            const end = document.getElementById('endereco').value;
            const troco = document.getElementById('troco').value;

            if(!nome || (deliveryType === 'Entrega' && !end) || !paymentType) {
                return alert("Por favor, preencha todas as informações!");
            }

            let msg = `*🛒 NOVO PEDIDO - PASTEL DA ALINE*\n`;
            msg += `----------------------------------\n`;
            msg += `*Cliente:* ${nome}\n`;
            msg += `*Tipo:* ${deliveryType}\n`;
            if(deliveryType === 'Entrega') msg += `*Endereço:* ${end}\n`;
            msg += `*Pagamento:* ${paymentType}\n`;
            if(troco) msg += `*Troco para:* R$ ${troco}\n`;
            msg += `----------------------------------\n`;
            msg += `*ITENS:*\n`;
            cart.forEach(i => msg += `• ${i.n} - R$ ${i.p.toFixed(2)}\n`);
            msg += `----------------------------------\n`;
            msg += `*TOTAL: R$ ${total.toFixed(2)}*\n\n`;
            msg += `_Obrigado pela preferência!_`;

            window.open(`https://wa.me/5581986811235?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
```
