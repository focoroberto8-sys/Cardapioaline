<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Premium Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fffdf0; }
        .bg-yellow-aline { background-color: #FFD700; }
        .text-red-aline { color: #E60000; }
        
        /* Capa e Logo */
        .header-bg { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=800'); 
            background-size: cover; background-position: center; height: 160px; position: relative;
        }
        .logo-container { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .logo-profile { 
            width: 115px; height: 115px; border-radius: 50%; border: 4px solid #FFD700;
            background-color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.15); object-fit: cover;
        }

        /* Animações */
        .modal-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .btn-pay.active { border-color: #E60000; background-color: #fff5f5; color: #E60000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <!-- HEADER -->
    <div class="header-bg">
        <div class="logo-container">
            <!-- LOGO ATUALIZADO -->
            <img src="https://i.ibb.co/Ld89R7G/logo-aline.jpg" class="logo-profile" alt="Pastel da Aline">
        </div>
    </div>

    <!-- INFOS DA LOJA -->
    <div class="bg-yellow-aline pt-16 pb-6 px-6 text-center">
        <h1 class="text-2xl font-bold text-red-600 uppercase">Pastel da Aline</h1>
        <p class="text-red-800 text-xs italic font-medium">"Nunca foi sorte, sempre foi Deus"</p>
        
        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://wa.me/5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fab fa-whatsapp text-xl"></i></a>
            <a href="tel:5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-phone-alt"></i></a>
            <a href="#" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-map-marker-alt"></i></a>
        </div>
    </div>

    <!-- CATEGORIAS -->
    <div class="sticky top-0 bg-white/90 backdrop-blur-md z-40 py-4 px-4 flex space-x-3 overflow-x-auto no-scrollbar shadow-sm">
        <button class="bg-red-600 text-white px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-md">PASTÉIS</button>
        <button class="bg-gray-100 text-gray-500 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">BURGUERS</button>
        <button class="bg-gray-100 text-gray-500 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">PIZZAS</button>
        <button class="bg-gray-100 text-gray-500 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">AÇAÍ</button>
    </div>

    <!-- PRODUTOS -->
    <div id="menu" class="p-4 space-y-4">
        <!-- ITEM DE EXEMPLO -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div class="flex-1 pr-4">
                <span class="text-[9px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded font-bold uppercase">Mais Pedido</span>
                <h3 class="font-bold text-gray-800 text-sm mt-1 uppercase">Pastel Especial da Aline</h3>
                <p class="text-[10px] text-gray-400 my-1 leading-tight">Carne, queijo, ovo, azeitona e muito amor.</p>
                <p class="text-red-600 font-bold text-lg">R$ 18,00</p>
            </div>
            <div class="relative w-20 h-20">
                <img src="https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=200" class="w-full h-full object-cover rounded-xl">
                <button onclick="add('Pastel Especial', 18.00)" class="absolute -bottom-1 -left-1 bg-red-600 text-white w-8 h-8 rounded-lg shadow-lg flex items-center justify-center font-bold">+</button>
            </div>
        </div>
    </div>

    <!-- CARRINHO FLUTUANTE -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 z-50 hidden">
        <div class="bg-red-600 text-white p-4 rounded-2xl flex items-center justify-between shadow-2xl">
            <div>
                <p id="cart-count" class="text-[10px] font-bold opacity-80 uppercase">0 ITENS</p>
                <p id="cart-total" class="text-lg font-bold">R$ 0,00</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-yellow-400 text-red-700 px-6 py-2 rounded-xl font-bold uppercase text-xs shadow-md">Concluir</button>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col justify-end">
        <div class="bg-white w-full max-h-[92vh] rounded-t-[30px] p-6 overflow-y-auto modal-up">
            <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-6"></div>
            
            <h2 class="text-xl font-bold text-center mb-6">Finalizar Pedido</h2>

            <!-- ENTREGA / RETIRADA -->
            <div class="flex space-x-3 mb-6">
                <button id="mode-delivery" onclick="setMode('Entrega')" class="flex-1 p-3 border-2 rounded-xl font-bold text-xs border-red-600 text-red-600 bg-red-50">ENTREGA</button>
                <button id="mode-pickup" onclick="setMode('Retirada')" class="flex-1 p-3 border-2 rounded-xl font-bold text-xs border-gray-100 text-gray-400">RETIRADA</button>
            </div>

            <!-- DADOS CLIENTE -->
            <div class="space-y-3 mb-6">
                <input type="text" id="cust-name" placeholder="Seu Nome" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-sm">
                <input type="text" id="cust-address" placeholder="Endereço e Bairro" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-sm">
            </div>

            <!-- PAGAMENTO -->
            <p class="font-bold text-sm mb-3">Forma de Pagamento:</p>
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="setPay('Pix')" class="pay-opt p-3 border rounded-xl flex flex-col items-center text-[10px] font-bold text-gray-400">
                    <i class="fas fa-qrcode mb-1 text-blue-500"></i> PIX
                </button>
                <button onclick="setPay('Cartão')" class="pay-opt p-3 border rounded-xl flex flex-col items-center text-[10px] font-bold text-gray-400">
                    <i class="fas fa-credit-card mb-1 text-purple-500"></i> CARTÃO
                </button>
                <button onclick="setPay('Dinheiro')" class="pay-opt p-3 border rounded-xl flex flex-col items-center text-[10px] font-bold text-gray-400">
                    <i class="fas fa-money-bill-wave mb-1 text-green-500"></i> DINHEIRO
                </button>
            </div>

            <!-- TROCO -->
            <div id="change-box" class="hidden mb-6">
                <input type="number" id="change-value" placeholder="Troco para quanto?" class="w-full p-4 bg-green-50 rounded-xl outline-none text-sm">
            </div>

            <!-- BOTÃO FINAL -->
            <button onclick="send()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center active:scale-95 transition-all">
                <i class="fab fa-whatsapp mr-2 text-xl"></i> FINALIZAR NO WHATSAPP
            </button>
            <button onclick="toggleModal(false)" class="w-full text-gray-400 text-xs font-bold py-4">CANCELAR E VOLTAR</button>
        </div>
    </div>

    <script>
        let cart = []; let total = 0; let mode = 'Entrega'; let payment = '';

        function add(n, p) {
            cart.push({n, p}); total += p;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('cart-count').innerText = `${cart.length} ITENS`;
            document.getElementById('cart-total').innerText = 'R$ ' + total.toFixed(2);
        }

        function toggleModal(s) {
            const m = document.getElementById('modal-checkout');
            m.classList.toggle('hidden', !s); m.classList.toggle('flex', s);
        }

        function setMode(m) {
            mode = m;
            document.getElementById('mode-delivery').className = m === 'Entrega' ? 'flex-1 p-3 border-2 rounded-xl font-bold text-xs border-red-600 text-red-600 bg-red-50' : 'flex-1 p-3 border-2 rounded-xl font-bold text-xs border-gray-100 text-gray-400';
            document.getElementById('mode-pickup').className = m === 'Retirada' ? 'flex-1 p-3 border-2 rounded-xl font-bold text-xs border-red-600 text-red-600 bg-red-50' : 'flex-1 p-3 border-2 rounded-xl font-bold text-xs border-gray-100 text-gray-400';
            document.getElementById('cust-address').classList.toggle('hidden', m === 'Retirada');
        }

        function setPay(p) {
            payment = p;
            document.querySelectorAll('.pay-opt').forEach(b => b.classList.remove('border-red-600', 'text-red-600', 'bg-red-50'));
            event.currentTarget.classList.add('border-red-600', 'text-red-600', 'bg-red-50');
            document.getElementById('change-box').classList.toggle('hidden', p !== 'Dinheiro');
        }

        // CAMINHO ABERTO PARA SUPABASE
        async function saveOrderToSupabase(orderData) {
            console.log("Aqui conectaremos o Supabase para salvar:", orderData);
            // Em breve: const { data, error } = await supabase.from('pedidos').insert([orderData])
        }

        function send() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-address').value;
            const change = document.getElementById('change-value').value;

            if(!name || (mode === 'Entrega' && !addr) || !payment) return alert("Preencha tudo!");

            const orderData = { name, mode, addr, payment, change, items: cart, total };
            saveOrderToSupabase(orderData); // Chamada preparada

            let txt = `*🍟 NOVO PEDIDO - PASTEL DA ALINE*\n`;
            txt += `*Cliente:* ${name}\n*Modo:* ${mode}\n`;
            if(mode === 'Entrega') txt += `*End:* ${addr}\n`;
            txt += `*Pgto:* ${payment}\n`;
            if(change) txt += `*Troco:* R$ ${change}\n`;
            txt += `\n*ITENS:*\n`;
            cart.forEach(i => txt += `• ${i.n} (R$ ${i.p.toFixed(2)})\n`);
            txt += `\n*TOTAL: R$ ${total.toFixed(2)}*`;

            window.open(`https://wa.me/5581986811235?text=${encodeURIComponent(txt)}`);
        }
    </script>
</body>
</html>
```
