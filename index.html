<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Cardápio Interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fffdf0; }
        .bg-yellow-aline { background-color: #FFD700; }
        .text-red-aline { color: #E60000; }
        .bg-red-aline { background-color: #E60000; }
        
        .header-bg { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=800'); 
            background-size: cover; background-position: center; height: 140px; position: relative;
        }
        .logo-container { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .logo-profile { 
            width: 100px; height: 100px; border-radius: 50%; border: 4px solid #FFD700;
            background-color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.15); object-fit: cover;
        }

        .modal-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .option-active { border-color: #E60000; background-color: #fff5f5; color: #E60000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <!-- HEADER -->
    <div class="header-bg">
        <div class="logo-container">
            <img src="logo.jpg" class="logo-profile" alt="Logo Pastel da Aline" onerror="this.src='https://via.placeholder.com/150?text=Aline'">
        </div>
    </div>

    <!-- INFOS DA LOJA -->
    <div class="bg-yellow-aline pt-14 pb-6 px-6 text-center shadow-md">
        <h1 class="text-2xl font-bold text-red-600 uppercase tracking-tighter">Pastel da Aline</h1>
        <p class="text-red-800 text-[10px] italic font-medium">"Nunca foi sorte, sempre foi Deus"</p>
        
        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://wa.me/5581986811235" class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fab fa-whatsapp text-lg"></i></a>
            <a href="tel:5581986811235" class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-phone-alt text-lg"></i></a>
            <a href="https://www.google.com/maps/search/Av.+Agamenon+Magalhães+195,+Santo+Amaro" class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-map-marker-alt text-lg"></i></a>
        </div>
    </div>

    <!-- CATEGORIAS -->
    <div class="sticky top-0 bg-white/95 backdrop-blur-md z-40 py-4 px-4 flex space-x-3 overflow-x-auto no-scrollbar shadow-sm">
        <button class="bg-red-600 text-white px-6 py-2 rounded-full text-[10px] font-bold whitespace-nowrap uppercase">Pastéis</button>
        <button class="bg-gray-100 text-gray-400 px-6 py-2 rounded-full text-[10px] font-bold whitespace-nowrap uppercase">Bebidas</button>
    </div>

    <!-- PRODUTOS -->
    <div id="menu" class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex justify-between items-center border-l-4 border-yellow-400">
            <div class="flex-1 pr-4">
                <h3 class="font-bold text-gray-800 text-sm uppercase">Pastel Especial da Aline</h3>
                <p class="text-[10px] text-gray-400 my-1 leading-tight text-justify">Carne moída premium, ovo, azeitona e o tempero secreto.</p>
                <p class="text-red-600 font-bold text-lg">R$ 18,00</p>
            </div>
            <div class="relative w-20 h-20">
                <img src="https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=200" class="w-full h-full object-cover rounded-xl shadow-inner">
                <button onclick="add('Pastel Especial', 18.00)" class="absolute -bottom-1 -left-1 bg-red-600 text-white w-8 h-8 rounded-lg shadow-lg flex items-center justify-center font-bold active:scale-90 transition-all">+</button>
            </div>
        </div>
    </div>

    <!-- BARRA DE CARRINHO -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 z-50 hidden">
        <div class="bg-red-600 text-white p-4 rounded-2xl flex items-center justify-between shadow-2xl">
            <div>
                <p id="cart-count" class="text-[9px] font-bold opacity-80 uppercase tracking-widest">0 Itens na Sacola</p>
                <p id="cart-total" class="text-lg font-bold">R$ 0,00</p>
            </div>
            <button onclick="openCheckout()" class="bg-yellow-400 text-red-700 px-6 py-2 rounded-xl font-bold uppercase text-xs shadow-md">Finalizar</button>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT PROFISSIONAL -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-[60] hidden flex-col justify-end">
        <div class="bg-white w-full max-h-[95vh] rounded-t-[30px] p-6 overflow-y-auto modal-up">
            <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h2 class="text-xl font-bold text-center mb-6 text-gray-800 uppercase italic">Dados do Pedido</h2>

            <!-- ENTREGA OU RETIRADA -->
            <div class="flex space-x-2 mb-6">
                <button id="mode-del" onclick="setMode('Entrega')" class="flex-1 p-3 border-2 rounded-xl font-bold text-[10px] option-active">PARA ENTREGA</button>
                <button id="mode-pick" onclick="setMode('Retirada')" class="flex-1 p-3 border-2 rounded-xl font-bold text-[10px] border-gray-100 text-gray-400">RETIRAR NA LOJA</button>
            </div>

            <!-- FORMULÁRIO -->
            <div class="space-y-3 mb-6">
                <input type="text" id="cust-name" placeholder="Seu Nome" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-sm">
                <input type="text" id="cust-addr" placeholder="Endereço Completo (Rua, Nº, Bairro)" class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-sm">
            </div>

            <!-- PAGAMENTO -->
            <p class="font-bold text-xs text-gray-500 mb-3 uppercase tracking-tighter">Forma de Pagamento:</p>
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="setPay('Pix')" class="pay-btn p-3 border rounded-xl flex flex-col items-center text-[9px] font-bold text-gray-400">
                    <i class="fas fa-qrcode mb-1 text-blue-500 text-lg"></i>PIX
                </button>
                <button onclick="setPay('Cartão')" class="pay-btn p-3 border rounded-xl flex flex-col items-center text-[9px] font-bold text-gray-400">
                    <i class="fas fa-credit-card mb-1 text-purple-500 text-lg"></i>CARTÃO
                </button>
                <button onclick="setPay('Dinheiro')" class="pay-btn p-3 border rounded-xl flex flex-col items-center text-[9px] font-bold text-gray-400">
                    <i class="fas fa-money-bill-wave mb-1 text-green-500 text-lg"></i>DINHEIRO
                </button>
            </div>

            <!-- TROCO -->
            <div id="troco-box" class="hidden mb-6 animate-pulse">
                <input type="number" id="troco-val" placeholder="Troco para quanto?" class="w-full p-4 bg-green-50 rounded-xl border border-green-200 outline-none text-sm font-bold text-green-700">
            </div>

            <button onclick="sendOrder()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center uppercase tracking-widest active:scale-95 transition-all">
                <i class="fab fa-whatsapp mr-2 text-xl"></i> Enviar para Aline
            </button>
            <button onclick="closeCheckout()" class="w-full text-gray-400 text-[10px] font-bold py-4 uppercase underline">Voltar</button>
        </div>
    </div>

    <script>
        let cart = []; let total = 0; let mode = 'Entrega'; let pay = '';

        function add(n, p) {
            cart.push({n, p}); total += p;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('cart-count').innerText = `${cart.length} ITENS NA SACOLA`;
            document.getElementById('cart-total').innerText = 'R$ ' + total.toFixed(2);
        }

        function openCheckout() {
            const m = document.getElementById('modal-checkout');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeCheckout() {
            document.getElementById('modal-checkout').classList.add('hidden');
        }

        function setMode(m) {
            mode = m;
            document.getElementById('mode-del').className = m === 'Entrega' ? 'flex-1 p-3 border-2 rounded-xl font-bold text-[10px] option-active' : 'flex-1 p-3 border-2 rounded-xl font-bold text-[10px] border-gray-100 text-gray-400';
            document.getElementById('mode-pick').className = m === 'Retirada' ? 'flex-1 p-3 border-2 rounded-xl font-bold text-[10px] option-active' : 'flex-1 p-3 border-2 rounded-xl font-bold text-[10px] border-gray-100 text-gray-400';
            document.getElementById('cust-addr').classList.toggle('hidden', m === 'Retirada');
        }

        function setPay(p) {
            pay = p;
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('option-active', 'border-red-600'));
            event.currentTarget.classList.add('option-active', 'border-red-600');
            document.getElementById('troco-box').classList.toggle('hidden', p !== 'Dinheiro');
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-addr').value;
            const troco = document.getElementById('troco-val').value;

            if(!name || (mode === 'Entrega' && !addr) || !pay) return alert("Por favor, preencha todos os campos!");

            let txt = `*🍔 NOVO PEDIDO - PASTEL DA ALINE*\n`;
            txt += `------------------------------------\n`;
            txt += `*Cliente:* ${name}\n`;
            txt += `*Pedido para:* ${mode}\n`;
            if(mode === 'Entrega') txt += `*Endereço:* ${addr}\n`;
            txt += `*Pagamento:* ${pay}\n`;
            if(pay === 'Dinheiro' && troco) txt += `*Troco para:* R$ ${troco}\n`;
            txt += `------------------------------------\n`;
            txt += `*ITENS:*\n`;
            cart.forEach(i => txt += `• 1x ${i.n} - R$ ${i.p.toFixed(2)}\n`);
            txt += `------------------------------------\n`;
            txt += `*TOTAL: R$ ${total.toFixed(2)}*\n\n`;
            txt += `_Pedido gerado pelo Cardápio Digital_`;

            window.open(`https://wa.me/5581986811235?text=${encodeURIComponent(txt)}`);
        }
    </script>
</body>
</html>
```
