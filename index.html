<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Cardápio Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fffdf0; }
        .bg-yellow-aline { background-color: #FFD700; }
        .header-bg { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=800'); 
            background-size: cover; background-position: center; height: 160px; position: relative;
        }
        .logo-container { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .logo-profile { 
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid #FFD700;
            background-color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.2); object-fit: cover;
        }
        .modal-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

    <!-- HEADER -->
    <div class="header-bg">
        <div class="logo-container">
            <!-- IMAGEM CORRIGIDA - LOGO DA ALINE -->
            <img src="https://i.ibb.co/kX87pPj7/f76020c2-be00-4822-bc78-62d2958479e0.jpg" class="logo-profile" onerror="this.src='https://via.placeholder.com/150?text=Pastel+Aline'">
        </div>
    </div>

    <!-- INFOS DA LOJA -->
    <div class="bg-yellow-aline pt-16 pb-6 px-6 text-center shadow-md">
        <h1 class="text-2xl font-bold text-red-600 uppercase">Pastel da Aline</h1>
        <p class="text-red-800 text-xs italic font-medium">"Nunca foi sorte, sempre foi Deus"</p>
        
        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://wa.me/5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fab fa-whatsapp text-xl"></i></a>
            <a href="tel:5581986811235" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-phone-alt"></i></a>
            <a href="https://www.google.com/maps/search/Av.+Agamenon+Magalhães+195,+Santo+Amaro" target="_blank" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-map-marker-alt"></i></a>
        </div>
    </div>

    <!-- CATEGORIAS -->
    <div class="sticky top-0 bg-white/90 backdrop-blur-md z-40 py-4 px-4 flex space-x-3 overflow-x-auto no-scrollbar shadow-sm">
        <button class="bg-red-600 text-white px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">PASTÉIS</button>
        <button class="bg-gray-100 text-gray-500 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">BURGUERS</button>
        <button class="bg-gray-100 text-gray-500 px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">PIZZAS</button>
    </div>

    <!-- PRODUTOS -->
    <div id="menu" class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center border-l-4 border-yellow-400">
            <div class="flex-1 pr-4">
                <span class="text-[9px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded font-bold uppercase">Destaque</span>
                <h3 class="font-bold text-gray-800 text-sm mt-1 uppercase">Pastel Especial da Aline</h3>
                <p class="text-[10px] text-gray-400 my-1 leading-tight">Carne, queijo, ovo, azeitona e segredo da casa.</p>
                <p class="text-red-600 font-bold text-lg">R$ 18,00</p>
            </div>
            <div class="relative w-20 h-20">
                <img src="https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=200" class="w-full h-full object-cover rounded-xl">
                <button onclick="add('Pastel Especial', 18.00)" class="absolute -bottom-1 -left-1 bg-red-600 text-white w-8 h-8 rounded-lg shadow-lg flex items-center justify-center font-bold">+</button>
            </div>
        </div>
    </div>

    <!-- BOTÃO CARRINHO -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 z-50 hidden">
        <div class="bg-red-600 text-white p-4 rounded-2xl flex items-center justify-between shadow-2xl">
            <div>
                <p id="cart-count" class="text-[10px] font-bold opacity-80 uppercase">0 ITENS</p>
                <p id="cart-total" class="text-lg font-bold">R$ 0,00</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-yellow-400 text-red-700 px-6 py-2 rounded-xl font-bold uppercase text-xs">Concluir</button>
        </div>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col justify-end">
        <div class="bg-white w-full max-h-[92vh] rounded-t-[30px] p-6 overflow-y-auto modal-up">
            <h2 class="text-xl font-bold text-center mb-6">Finalizar Pedido</h2>
            <div class="flex space-x-3 mb-6">
                <button id="m-del" onclick="setM('Entrega')" class="flex-1 p-3 border-2 rounded-xl font-bold text-xs border-red-600 text-red-600 bg-red-50">ENTREGA</button>
                <button id="m-pic" onclick="setM('Retirada')" class="flex-1 p-3 border-2 rounded-xl font-bold text-xs border-gray-100 text-gray-400">RETIRADA</button>
            </div>
            <input type="text" id="c-name" placeholder="Seu Nome" class="w-full p-4 bg-gray-50 rounded-xl mb-3 outline-none text-sm">
            <input type="text" id="c-addr" placeholder="Endereço Completo" class="w-full p-4 bg-gray-50 rounded-xl mb-6 outline-none text-sm">
            
            <p class="font-bold text-sm mb-3 font-bold">Pagamento:</p>
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="setP('Pix')" class="p-opt p-3 border rounded-xl text-[10px] font-bold">PIX</button>
                <button onclick="setP('Cartão')" class="p-opt p-3 border rounded-xl text-[10px] font-bold">CARTÃO</button>
                <button onclick="setP('Dinheiro')" class="p-opt p-3 border rounded-xl text-[10px] font-bold">DINHEIRO</button>
            </div>

            <button onclick="send()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg">FINALIZAR WHATSAPP</button>
            <button onclick="toggleModal(false)" class="w-full text-gray-400 text-xs py-4 font-bold uppercase">Voltar</button>
        </div>
    </div>

    <script>
        let cart = []; let total = 0; let mode = 'Entrega'; let payment = '';
        function add(n, p) {
            cart.push({n, p}); total += p;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('cart-count').innerText = `${cart.length} ITENS`;
            document.getElementById('cart-total').innerText = 'R$ ' + total.toFixed(2);
        }
        function toggleModal(s) { document.getElementById('modal-checkout').classList.toggle('hidden', !s); document.getElementById('modal-checkout').classList.toggle('flex', s); }
        function setM(m) { mode = m; document.getElementById('c-addr').classList.toggle('hidden', m === 'Retirada'); }
        function setP(p) { payment = p; document.querySelectorAll('.p-opt').forEach(b => b.classList.remove('bg-red-50', 'border-red-600')); event.currentTarget.classList.add('bg-red-50', 'border-red-600'); }
        function send() {
            const name = document.getElementById('c-name').value;
            const addr = document.getElementById('c-addr').value;
            if(!name || (mode === 'Entrega' && !addr) || !payment) return alert("Preencha tudo!");
            let txt = `*PEDIDO - ALINE*\nCliente: ${name}\nModo: ${mode}\nPgto: ${payment}\n\n*ITENS:*\n`;
            cart.forEach(i => txt += `• ${i.n} (R$ ${i.p.toFixed(2)})\n`);
            txt += `\n*TOTAL: R$ ${total.toFixed(2)}*`;
            window.open(`https://wa.me/5581986811235?text=${encodeURIComponent(txt)}`);
        }
    </script>
</body>
</html>
```
