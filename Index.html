 




<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel da Aline - Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .bg-aline-yellow { background-color: #FFD700; }
        .text-aline-red { color: #E60000; }
        .bg-aline-red { background-color: #E60000; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .product-card { transition: transform 0.2s; border-radius: 12px; }
        .product-card:active { transform: scale(0.98); }
        .cart-modal { transition: bottom 0.4s ease; }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER & LOGO -->
    <div class="bg-aline-red pt-8 pb-16 px-6 rounded-b-[40px] shadow-lg text-center relative">
        <div class="w-28 h-28 bg-white rounded-full mx-auto border-4 border-aline-yellow shadow-md overflow-hidden mb-2">
            <!-- Coloque o link da foto do logo aqui -->
            <img src="https://via.placeholder.com/150?text=Logo+Aline" alt="Pastel da Aline" class="w-full h-full object-cover">
        </div>
        <h1 class="text-white text-2xl font-bold">Pastel da Aline</h1>
        <p class="text-yellow-300 text-xs italic italic">"Nunca foi sorte, sempre foi Deus"</p>
        
        <!-- STATUS BADGE -->
        <div class="absolute -bottom-5 left-1/2 transform -translate-x-1/2 bg-white px-6 py-2 rounded-full shadow-md flex items-center space-x-2">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-sm font-semibold text-gray-700 uppercase tracking-widest">Aberto agora</span>
        </div>
    </div>

    <!-- INFO LOJA -->
    <div class="mt-10 px-6 text-center text-gray-600 text-sm">
        <p><i class="fas fa-map-marker-alt text-aline-red mr-1"></i> Av. Agamenon Magalhães 195, Santo Amaro</p>
        <p class="mt-1"><i class="fas fa-clock mr-1"></i> Terça à Domingo</p>
    </div>

    <!-- CATEGORIAS (Scroll Horizontal) -->
    <div class="mt-6 sticky top-0 bg-gray-50 z-30 py-4 px-4 border-b">
        <div class="flex space-x-4 overflow-x-auto category-scroll">
            <button onclick="filterCat('pastéis')" class="bg-aline-yellow text-red-700 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap border-2 border-aline-yellow">Pastéis</button>
            <button onclick="filterCat('hambúrguer')" class="bg-white text-gray-500 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap border-2 border-transparent">Hambúrguer</button>
            <button onclick="filterCat('pizzas')" class="bg-white text-gray-500 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap border-2 border-transparent">Pizzas</button>
            <button onclick="filterCat('bebidas')" class="bg-white text-gray-500 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap border-2 border-transparent">Bebidas</button>
        </div>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <div id="menu-container" class="px-6 mt-6 space-y-4">
        <!-- O JS vai preencher aqui -->
    </div>

    <!-- BARRA FLUTUANTE DE CARRINHO (IGUAL A FOTO) -->
    <div id="cart-footer" class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-100 p-4 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-40 hidden translate-y-full transition-transform duration-300">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center">
                <div class="relative mr-4">
                    <i class="fas fa-shopping-bag text-aline-red text-3xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase">Total do Pedido</p>
                    <p id="cart-total" class="text-xl font-bold text-gray-800">R$ 0,00</p>
                </div>
            </div>
            <button onclick="openCheckout()" class="bg-aline-red text-white px-8 py-3 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                Finalizar <i class="fas fa-chevron-right ml-2 text-xs"></i>
            </button>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-end">
        <div class="bg-white w-full rounded-t-[30px] p-8 space-y-4 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Finalizar Pedido</h2>
            <input type="text" id="cust-name" placeholder="Seu nome" class="w-full p-4 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-aline-yellow outline-none">
            <input type="text" id="cust-address" placeholder="Endereço Completo (Rua, Nº, Bairro)" class="w-full p-4 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-aline-yellow outline-none">
            
            <select id="cust-payment" class="w-full p-4 bg-gray-100 rounded-xl border-none outline-none">
                <option value="Pix">Pagamento via Pix</option>
                <option value="Cartão">Cartão (Entregar maquininha)</option>
                <option value="Dinheiro">Dinheiro (Espécie)</option>
            </select>

            <button onclick="sendOrder()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold text-lg shadow-xl">
                <i class="fab fa-whatsapp mr-2 text-xl"></i> Enviar Pedido no WhatsApp
            </button>
            <button onclick="closeCheckout()" class="w-full text-gray-400 font-bold py-2">Voltar ao cardápio</button>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: 1, cat: 'pastéis', name: 'Pastel de Carne', price: 12.00, desc: 'Carne moída temperada e muito crocante.', img: 'https://via.placeholder.com/100' },
            { id: 2, cat: 'pastéis', name: 'Pastel de Queijo', price: 12.00, desc: 'Muçarela derretida com orégano.', img: 'https://via.placeholder.com/100' },
            { id: 3, cat: 'hambúrguer', name: 'X-Bacon Aline', price: 22.00, desc: 'Pão, blend 150g, muito bacon e queijo.', img: 'https://via.placeholder.com/100' },
            { id: 4, cat: 'pizzas', name: 'Pizza Calabresa', price: 35.00, desc: 'Calabresa fatiada e cebola fresca.', img: 'https://via.placeholder.com/100' },
            { id: 5, cat: 'bebidas', name: 'Coca-Cola 2L', price: 12.00, desc: 'Gelada e refrescante.', img: 'https://via.placeholder.com/100' }
        ];

        let cart = [];
        let total = 0;

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div class="product-card bg-white p-4 flex justify-between items-center shadow-sm border border-gray-100">
                    <div class="flex-1 pr-4">
                        <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                        <p class="text-gray-400 text-xs mb-2 leading-tight">${item.desc}</p>
                        <span class="text-aline-red font-bold text-lg">R$ ${item.price.toFixed(2)}</span>
                    </div>
                    <div class="relative">
                        <img src="${item.img}" class="w-24 h-24 rounded-2xl object-cover">
                        <button onclick="addToCart(${item.id})" class="absolute -bottom-2 -left-2 bg-aline-yellow text-white w-10 h-10 rounded-xl shadow-lg flex items-center justify-center border-2 border-white">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            cart.push(item);
            total += item.price;
            updateCartUI();
        }

        function updateCartUI() {
            const footer = document.getElementById('cart-footer');
            if(cart.length > 0) {
                footer.classList.remove('hidden');
                footer.style.transform = 'translateY(0)';
            }
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2)}`;
        }

        function openCheckout() {
            const modal = document.getElementById('checkout-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCheckout() {
            const modal = document.getElementById('checkout-modal');
            modal.classList.add('hidden');
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-address').value;
            const pay = document.getElementById('cust-payment').value;

            if(!name || !addr) return alert("Por favor, preencha nome e endereço!");

            let msg = `*PEDIDO - PASTEL DA ALINE*\n`;
            msg += `----------------------------\n`;
            msg += `*Cliente:* ${name}\n`;
            msg += `*Endereço:* ${addr}\n`;
            msg += `*Pagamento:* ${pay}\n`;
            msg += `----------------------------\n`;
            msg += `*ITENS:*\n`;
            
            cart.forEach(item => {
                msg += `• 1x ${item.name} - R$ ${item.price.toFixed(2)}\n`;
            });

            msg += `----------------------------\n`;
            msg += `*TOTAL: R$ ${total.toFixed(2)}*\n\n`;
            msg += `_"Nunca foi sorte, sempre foi Deus"_`;

            const phone = "5581986811235";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        }

        renderMenu();
    </script>
</body>
</html>
```
